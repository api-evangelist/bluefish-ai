source: live probes of /.well-known/* on every Bluefish AI host
note: >-
  Round 2 upgrade. The 2026-07-18 pass probed only bluefishai.com and
  platform.bluefishai.com root paths and recorded an all-404 negative result. This
  pass discovered mcp.bluefishai.com in DNS, followed its 301 to
  https://platform.bluefishai.com/mcp, and read the RFC 9728 resource_metadata URL
  straight out of the 401 WWW-Authenticate challenge header. That pointed at a real
  200 protected-resource document, which in turn named auth.bluefishai.com as the
  authorization server, where RFC 8414 and OIDC discovery documents are both served
  anonymously. Three real discovery documents plus a JWKS are now captured. The
  WellKnown pointer in apis.yml is earned by these 200s, not asserted.
