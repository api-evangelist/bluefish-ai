apis:
- aid: bluefish-ai-mcp
  name: Bluefish AI MCP Server
  description: A live, first-party remote Model Context Protocol server that makes the Bluefish AI platform
    callable by agents over Streamable HTTP. It is protected by OAuth 2.1 and requires the mcp:connect
    scope; an unauthenticated request returns 401 with an RFC 9728 resource_metadata challenge pointing
    at the protected-resource document. Bluefish does not document this endpoint anywhere on its public
    site; it was discovered by probing, and the tool list remains auth-gated.
  humanURL: https://www.bluefishai.com/platform
  baseURL: https://platform.bluefishai.com/mcp
