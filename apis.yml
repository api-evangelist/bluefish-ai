aid: bluefish-ai
name: Bluefish AI
description: Bluefish AI is an enterprise AI marketing platform built for Fortune 500 brands to gain visibility
  and control over how they are represented across AI channels. The platform spans AI monitoring of brand
  reputation in AI-native experiences, generative engine optimization (GEO) to improve performance across
  AI search, GEO measurement frameworks, AI brand safety and accuracy verification, and agentic commerce
  tooling for AI-driven buying journeys. It serves search, content, brand, and PR teams. Founded by martech
  veterans whose prior advertising technologies are now owned by Microsoft and Meta, and backed by enterprise
  and AI investors including Bloomberg Beta and Threshold Ventures, with a $43M Series B in 2026. Bluefish
  publishes no developer documentation, OpenAPI definition, or SDKs, but it does operate a live first-party
  remote MCP server at platform.bluefishai.com/mcp, protected by OAuth 2.1 with full RFC 9728 and RFC 8414
  discovery and offered to customers as a connected app.
